name: Preparar imágenes institucionales
on:
  push:
    branches: [preparar-logotipos]
    paths: ['.github/workflows/logotipos.yml']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow cairosvg
      - name: Descargar y verificar imágenes
        shell: python
        run: |
          import io, time, urllib.request, pathlib
          import cairosvg
          from PIL import Image, ImageChops
          out = pathlib.Path('public/universidades')
          out.mkdir(exist_ok=True)
          for name, url in [["uvic.jpg","https://www.umanresa.cat/sites/default/files/docs/logo-uvic-ucc.jpg"],["us.png","https://fcom.us.es/sites/fcom/files/inline-images/logoUS-H_sinfondo.png"]]:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'CCD-EP academic project (https://github.com/jordicastellvimata-spec/ccd-ep)'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = response.read()
                  if name.endswith('.svg'):
                      data = cairosvg.svg2png(bytestring=data, output_width=650)
                  im = Image.open(io.BytesIO(data)).convert('RGBA')
                  paper = Image.new('RGB', im.size, 'white')
                  paper.paste(im, mask=im.getchannel('A'))
                  bounds = ImageChops.difference(paper, Image.new('RGB', paper.size, 'white')).convert('L').point(lambda v: 255 if v > 24 else 0).getbbox()
                  assert bounds
                  logo = paper.crop(bounds)
                  logo.thumbnail((540, 280), Image.Resampling.LANCZOS)
                  logo.save(out / (name.split('.')[0] + '.png'), optimize=True)
                  print(name, logo.size)
              except Exception as err:
                  print('ERROR',name,err)
              time.sleep(0.5)
      - name: Guardar imágenes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/universidades
          git commit -m "Incorporar logotipos institucionales"
          git push

name: Preparar imágenes institucionales
on:
  push:
    branches: [preparar-logotipos]
    paths: ['.github/workflows/logotipos.yml']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow cairosvg
      - name: Descargar y verificar imágenes
        shell: python
        run: |
          import io, time, urllib.request, pathlib
          import cairosvg
          from PIL import Image, ImageChops
          out = pathlib.Path('public/universidades')
          out.mkdir(exist_ok=True)
          for name, url in [["uab.svg","https://upload.wikimedia.org/wikipedia/commons/7/71/Autonome_Universit%C3%A4t_Barcelona_Logo.svg"],["uex.jpg","https://upload.wikimedia.org/wikipedia/commons/f/f1/Logotipo_oficial_de_la_UEx.jpg"],["us.jpg","https://upload.wikimedia.org/wikipedia/commons/5/5d/Logo_Universidad_de_Sevilla.jpg"],["uma.svg","https://upload.wikimedia.org/wikipedia/commons/4/4b/Logounimalaga.svg"],["uja.png","https://upload.wikimedia.org/wikipedia/commons/c/c4/LOGOUJA.png"],["unizar.svg","https://upload.wikimedia.org/wikipedia/commons/d/d7/LogoUZ.svg"],["ulpgc.svg","https://upload.wikimedia.org/wikipedia/commons/2/22/Universit%C3%A4t_Las_Palmas_de_Gran_Canaria_Logo.svg"],["uvic.jpg","https://upload.wikimedia.org/wikipedia/commons/a/a1/UVIC-3ratlles.jpg"],["unir.png","https://upload.wikimedia.org/wikipedia/commons/a/a4/Logo_UNIR_-_Universidad_Internacional_de_La_Rioja.png"],["uji.jpg","https://upload.wikimedia.org/wikipedia/commons/3/3e/Logo_UJI_%282017%29.jpg"],["lisboa.png","https://upload.wikimedia.org/wikipedia/commons/6/66/UPL_horizontal_main.png"],["manchester.png","https://assets.manchester.ac.uk/corporate/images/design/logo-university-of-manchester.png"],["ual.png","https://raw.githubusercontent.com/ualjjcanada/coordinacion-inf-iacs/44bc004c4073ef10e89d1b77eb97fad7a5561440/assets/logo-ual.png"],["waikato.svg","https://raw.githubusercontent.com/dr-who/waibiz.nz/bdebc1ccff7609aa9bc19eece18b28e828183276/assets/waikato-logo.svg"]]:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'CCD-EP academic project (https://github.com/jordicastellvimata-spec/ccd-ep)'})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = response.read()
                  if name.endswith('.svg'):
                      data = cairosvg.svg2png(bytestring=data, output_width=650)
                  im = Image.open(io.BytesIO(data)).convert('RGBA')
                  paper = Image.new('RGB', im.size, 'white')
                  paper.paste(im, mask=im.getchannel('A'))
                  bounds = ImageChops.difference(paper, Image.new('RGB', paper.size, 'white')).convert('L').point(lambda v: 255 if v > 24 else 0).getbbox()
                  assert bounds
                  logo = paper.crop(bounds)
                  logo.thumbnail((540, 280), Image.Resampling.LANCZOS)
                  logo.save(out / (name.split('.')[0] + '.png'), optimize=True)
                  print(name, logo.size)
              except Exception as err:
                  print('ERROR',name,err)
              time.sleep(0.5)
      - name: Guardar imágenes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/universidades
          git commit -m "Incorporar logotipos institucionales"
          git push

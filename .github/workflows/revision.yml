//webs.uab.cat/gredics/joan-llusa-serra/","https://webs.uab.cat/gredics/wp-content/uploads/sites/63/2018/09/joan.png"]],[23,["https://www.coursera.org/instructor/~70681064","https://d3njjcbhbojbot.cloudfront.net/api/utilities/v1/imageproxy/https%3A//coursera-instructor-photos.s3.amazonaws.com/7e/3134a7107f4c5b9fd3a5102a4f51e4/Gustavo-Gonzalez.jpg?auto=format%2Ccompress&dpr=1&h=200&w=200"]],[24,["https://docentes.us.es/index.php?id_fichero=93143e6657c0f3e1cd6806bccd559cca&page=comun%2Ff_descargar","PDF"]],[25,["https://urecerca.uvic.cat/CawDOS/jsf/seleccionActividades/seleccionActividades.jsf?elmeucv=N&id=6882341f30634ff4&idioma=ca&tipo=activ","https://campus.uvic.cat/imatges/fotos//223826.jpg"]],[26,["https://sites.google.com/view/decerc-gm/eng/c%C3%B2pia-de-la-p%C3%A0gina-proyecto/c%C3%B2pia-de-la-p%C3%A0gina-equipo","https://sites.google.com/sitesv-images-rt/AMxu72vCIHIpYpg6mcRhxu11lt40E2kQp_KNE4xLz9H18b6ZnLTrL06CkVCwSklHF0X9jCbjpi3kVo8yNhzqin4xGPi52Qw4LdCBsavzM88iQSbY_27w5m1P86kuyClU0AIrQUUGupATjjM8Dn88kBRuMqfxuEQklOp__08FiKeFeN_tZTu4-09-vX7ViluAbSivaoPwcj6PnUW9UN_m-wPZE-69oIy56leWHNmIqyxUHYQ%3Dw1280"]],[28,["https://publicacions.iec.cat/repository/pdf/00000489/00000098.pdf","PDF"]],[29,["https://research.manchester.ac.uk/en/persons/edda-sant/","https://research.manchester.ac.uk/files-asset/275234824/tempImagewdSHXO.jpg?f=jpg&w=160"]]]
          def get(u):
              r=requests.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0 (compatible; academic project photo review)'})
              r.raise_for_status()
              return r
          def fetch(it):
              i,(p,u)=it
              try:
                  if i==26:
                      soup=BeautifulSoup(get(p).content,'html.parser')
                      t=soup.find(string=lambda v:v and 'Fco Javier Jaraíz Cabanillas' in v)
                      u=t.find_previous('img')['src']
                  if i==5:
                      soup=BeautifulSoup(get(p).content,'html.parser')
                      u=soup.find('img',alt=lambda x:x and 'Myriam' in x)['src']
                  if i==19:
                      soup=BeautifulSoup(get(p).content,'html.parser')
                      imgs=[(img.get('data-src') or img.get('src',''),img.get('alt','')) for img in soup.select('img')]
                      print('ALFREDO '+str(imgs)[:2200])
                      u=next(u for u,al in imgs if 'alfredo' in (u+' '+al).lower() and not 'logo' in u.lower())
                  if u=='PDF':
                      doc=fitz.open(stream=get(p).content,filetype='pdf')
                      arr=doc[0].get_images(full=True)
                      print('PDFIMGS',i,[(x[0],x[2],x[3]) for x in arr])
                      for ix,x in enumerate(arr):
                          if min(x[2],x[3])<45:continue
                          encode(str(i)+'_'+str(ix),doc.extract_image(x[0])['image'])
                      return
                  if 'cloudfront.net/api/utilities/v1/imageproxy/' in u: u=unquote(u.split('imageproxy/')[1].split('?')[0])
                  encode(str(i),get(u).content)
              except Exception as e: print('FAILED',i,str(e)[:140])
          def encode(label,raw):
              im=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
              im.thumbnail((360,360))
              buff=io.BytesIO()
              im.save(buff,format='JPEG',quality=84)
              k=os.urandom(32); iv=os.urandom(12)
              enc=pub.encrypt(k,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))+iv+AESGCM(k).encrypt(iv,buff.getvalue(),None)
              print('REVIEW_'+label+'='+base64.b64encode(enc).decode())
          with concurrent.futures.ThreadPoolExecutor(10) as pool:list(pool.map(fetch,items))
